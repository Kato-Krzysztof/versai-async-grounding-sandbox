[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "versai-async-grounding-sandbox"
version = "0.1.0"
description = "Async agentic streaming sandbox with deterministic anti-hallucination grounding."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["versai"]

[tool.pytest.ini_options]
# `auto` mode lets every `async def test_*` run without per-test @pytest.mark.asyncio.
asyncio_mode = "auto"
testpaths = ["tests"]
